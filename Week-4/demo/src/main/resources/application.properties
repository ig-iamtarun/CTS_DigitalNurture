# =========================================
# MySQL configuration (default/active)
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# PostgreSQL configuration (uncomment to use instead of MySQL,
# and comment out the MySQL block above)
# =========================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/demo_db
# spring.datasource.username=postgres
# spring.datasource.password=your_postgres_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# JPA / Hibernate
# =========================================
# "update" auto-creates/updates tables from your entities - great for dev.
# Use "validate" or a migration tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect (remove/change if using Postgres)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# For Postgres, use instead:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================
# Server
# =========================================
server.port=8080
