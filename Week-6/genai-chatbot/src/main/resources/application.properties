# =========================================
# Anthropic API configuration
# =========================================
# NEVER hardcode the real key here. Set it as an environment variable:
#   export ANTHROPIC_API_KEY=sk-ant-...
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.base-url=https://api.anthropic.com
anthropic.api.version=2023-06-01
anthropic.api.model=claude-sonnet-5
anthropic.api.max-tokens=1024

# =========================================
# Server
# =========================================
server.port=8080

# =========================================
# Actuator (health checks for AWS load balancer / ECS)
# =========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
